<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-label="WAmate — WhatsApp Self-Chat AI Second Brain">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d12"/>
      <stop offset="55%" stop-color="#0c1720"/>
      <stop offset="100%" stop-color="#081118"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#00c896" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00c896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e0a8"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c896" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowRight)"/>

  <!-- Brand Icon Container -->
  <g transform="translate(88, 92)">
    <rect x="0" y="0" width="112" height="112" rx="28" fill="#0f1d27" stroke="url(#accentGrad)" stroke-width="2"/>
    <rect x="8" y="8" width="96" height="96" rx="22" fill="url(#accentGrad)" fill-opacity="0.12"/>
    <!-- Chat Bubble + Clock Memory Mark -->
    <g transform="translate(26, 26) scale(2.5)" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      <path d="M12 8v4l2.5 1.5"/>
    </g>
  </g>

  <!-- Title & Tagline -->
  <text x="234" y="136" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5">WAmate</text>
  <rect x="492" y="96" width="154" height="30" rx="15" fill="#00c896" fill-opacity="0.14" stroke="#00c896" stroke-opacity="0.45" stroke-width="1"/>
  <text x="569" y="116" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="0.6">SECOND BRAIN</text>

  <text x="236" y="176" fill="#9fb2c1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="21" font-weight="400">Turn your private WhatsApp self-chat into a local, multimodal AI memory.</text>

  <!-- Capability Pills -->
  <g transform="translate(236, 208)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="146" height="32" rx="10" fill="#13212c" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="16" cy="16" r="4" fill="#00e0a8"/>
    <text x="28" y="21" fill="#dbe6ee">SQLite + FTS5</text>

    <rect x="160" y="0" width="166" height="32" rx="10" fill="#13212c" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="176" cy="16" r="4" fill="#38bdf8"/>
    <text x="188" y="21" fill="#dbe6ee">OCR &amp; Docs Vault</text>

    <rect x="340" y="0" width="168" height="32" rx="10" fill="#13212c" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="356" cy="16" r="4" fill="#a78bfa"/>
    <text x="368" y="21" fill="#dbe6ee">Anti-Delete Vault</text>

    <rect x="522" y="0" width="176" height="32" rx="10" fill="#13212c" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="538" cy="16" r="4" fill="#fbbf24"/>
    <text x="550" y="21" fill="#dbe6ee">Web Explorer UI</text>
  </g>
</svg>
